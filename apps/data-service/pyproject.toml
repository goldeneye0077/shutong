[project]
name = "core-network-compliance-data-service"
version = "0.1.0"
description = "Internal data processing service for ingestion, rules, reports, and AI jobs."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

